<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | ProfitFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- Sidebar container -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <div class="header-title">
                    <h1>Transactions</h1>
                    <p>Manage and track all income and expense flows</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">
                        <i class="fa-solid fa-plus"></i> Add Transaction
                    </button>
                </div>
            </div>

            <!-- Filter Row -->
            <div class="filter-row">
                <div class="filter-group">
                    <label for="filter-type">Type:</label>
                    <select id="filter-type">
                        <option value="">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-category">Category:</label>
                    <select id="filter-category">
                        <option value="">All Categories</option>
                        <!-- Filled by JS -->
                    </select>
                </div>

                <div class="filter-group" style="flex: 1; max-width: 300px;">
                    <input type="text" id="search-input" placeholder="Search by description..." style="width: 100%;">
                </div>

                <button id="reset-filters" class="btn btn-outline" style="padding: 6px 16px; font-size: 0.85rem; border-radius: 8px;">
                    Reset
                </button>
            </div>

            <!-- Transactions Panel -->
            <div class="panel-card" style="margin-bottom: 0;">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-list">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-light); padding: 40px;">
                                    Loading transactions...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Transaction Modal -->
    <div class="modal" id="transaction-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Transaction</h3>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            
            <form id="transaction-form">
                <input type="hidden" id="tx-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tx-type">Type</label>
                        <select id="tx-type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tx-category">Category</label>
                        <select id="tx-category" required>
                            <!-- Filled dynamically by JS based on type -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tx-amount">Amount (INR)</label>
                        <input type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="tx-date">Date</label>
                        <input type="date" id="tx-date" required>
                    </div>

                    <div class="form-group">
                        <label for="tx-description">Description</label>
                        <textarea id="tx-description" rows="2" placeholder="e.g. Weekly grocery bills"></textarea>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" id="cancel-modal" style="padding: 10px 20px;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="padding: 10px 20px;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
