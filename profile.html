<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | ProfitFlow</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard-layout.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <div class="header-title">
                    <h1>Profile Settings</h1>
                    <p>Manage your account name, contact details, and password security</p>
                </div>
            </div>

            <div class="dashboard-details-grid" style="grid-template-columns: 1.2fr 1fr;">
                <!-- Update Name/Email -->
                <div class="panel-card">
                    <div class="panel-header">
                        <h3>Personal Details</h3>
                    </div>
                    <form id="profile-details-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="profile-name">Full Name</label>
                                <input type="text" id="profile-name" required>
                            </div>
                            <div class="form-group">
                                <label for="profile-email">Email Address</label>
                                <input type="email" id="profile-email" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
                            Save Changes
                        </button>
                    </form>
                </div>

                <!-- Update Password -->
                <div class="panel-card">
                    <div class="panel-header">
                        <h3>Update Password</h3>
                    </div>
                    <form id="profile-password-form">
                        <div class="form-grid" style="gap: 16px;">
                            <div class="form-group">
                                <label for="current-password">Current Password</label>
                                <input type="password" id="current-password" placeholder="Enter current password">
                            </div>
                            <div class="form-group">
                                <label for="new-password">New Password</label>
                                <input type="password" id="new-password" placeholder="Enter new password">
                            </div>
                            <div class="form-group">
                                <label for="confirm-new-password">Confirm New Password</label>
                                <input type="password" id="confirm-new-password" placeholder="Re-type new password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="padding: 10px 24px; margin-top: 10px;">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
